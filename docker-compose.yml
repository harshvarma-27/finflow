services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: finflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow"]
      interval: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://finflow:finflow@db:5432/finflow
      JWT_SECRET: change-me-in-real-use
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy
